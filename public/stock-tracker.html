<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Value Screener</title>
<style>
  :root {
    --bg: #09090b; --panel: #18181b; --panel-2: #27272a; --border: #3f3f46;
    --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a; --accent: #34d399; --accent-dim: #064e3b;
    --up: #34d399; --down: #fb7185; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0; } h2 { font-size: 17px; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .panel { background: rgba(24,24,27,.6); border: 1px solid var(--panel-2); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; width: auto; } button.primary { background: var(--accent-dim); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .help { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .status { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .bar { display: inline-block; width: 140px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; vertical-align: middle; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .err { border: 1px solid #9f1239; background: rgba(136,19,55,.3); color: #fda4af; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  .warn { border: 1px solid #92400e; background: rgba(120,53,15,.3); color: #fcd34d; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--panel-2); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--panel); padding: 8px 10px; white-space: nowrap; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td { padding: 7px 10px; border-top: 1px solid var(--panel-2); white-space: nowrap; }
  tr:hover td { background: rgba(39,39,42,.5); }
  tr.self td { background: rgba(6,78,59,.3); }
  .small { font-size: 12px; color: var(--muted); max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--dim); }
  .stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .stat { background: rgba(24,24,27,.6); border: 1px solid var(--panel-2); border-radius: 6px; padding: 8px 10px; }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
  .stat .v { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .cols { display: grid; gap: 24px; grid-template-columns: 2fr 1fr; } @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .news { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .news li { background: rgba(24,24,27,.6); border: 1px solid var(--panel-2); border-radius: 6px; padding: 10px; }
  .news a { color: var(--text); font-weight: 500; } .news a:hover { color: var(--accent); }
  .tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; background: var(--accent-dim); color: #6ee7b7; border-radius: 3px; padding: 1px 5px; margin: 4px 4px 0 0; }
  .tag.other { background: var(--panel-2); color: var(--muted); }
  .muted { color: var(--muted); } .foot { font-size: 12px; color: var(--dim); margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
</style>

// ============================================================================
// Finnhub client (free tier: 60 requests/minute, CORS enabled).
// ============================================================================
const FINNHUB = "https://finnhub.io/api/v1";
const LS = {
  key: "vs.apiKey", custom: "vs.customUniverse", useCustom: "vs.useCustom", cache: "vs.cache.v1", filters: "vs.filters",
};
const CACHE_TTL = 24 * 3600 * 1000;      // screener metrics
const DETAIL_TTL = 6 * 3600 * 1000;      // news / financials / peers
const MIN_GAP_MS = 1100;                 // ~55 req/min, under Finnhub's 60/min limit

let apiKey = localStorage.getItem(LS.key) || "";
let cache = loadCache();
function loadCache() { try { return JSON.parse(localStorage.getItem(LS.cache) || "{}"); } catch { return {}; } }
let saveTimer = null;
function saveCache() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS.cache, JSON.stringify(cache)); }
    catch (e) { console.warn("cache save failed (storage full?)", e); }
  }, 500);
}
function cacheGet(k, ttl) { const e = cache[k]; return e && Date.now() - e.t < ttl ? e.v : undefined; }
function cacheSet(k, v) { cache[k] = { t: Date.now(), v }; saveCache(); }

// Serialised request queue so we never exceed the rate limit; 429 -> back off and retry.
const queue = []; let pumping = false; let lastAt = 0;
function api(path, params = {}) {
  return new Promise((resolve, reject) => { queue.push({ path, params, resolve, reject }); pump(); });
}
async function pump() {
  if (pumping) return; pumping = true;
  while (queue.length) {
    const job = queue.shift();
    const wait = MIN_GAP_MS - (Date.now() - lastAt);
    if (wait > 0) await sleep(wait);
    lastAt = Date.now();
    try { job.resolve(await doFetch(job.path, job.params)); } catch (e) { job.reject(e); }
  }
  pumping = false;
}
async function doFetch(path, params, attempt = 0) {
  const url = new URL(FINNHUB + path);
  Object.entries(params).forEach(([k, v]) => v !== undefined && url.searchParams.set(k, v));
  url.searchParams.set("token", apiKey);
  const res = await fetch(url);
  if (res.status === 429 && attempt < 3) { await sleep(15000 * (attempt + 1)); lastAt = Date.now(); return doFetch(path, params, attempt + 1); }
  if (res.status === 401 || res.status === 403) throw new Error("Finnhub rejected the API key (HTTP " + res.status + ").");
  if (!res.ok) throw new Error("HTTP " + res.status + " for " + path);
  return res.json();
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ============================================================================
// Metrics. Finnhub's /stock/metric returns ratios and growth rates (growth in %).
// ============================================================================
const GROWTH_METRICS = [
  { key: "revenueGrowth3Y", label: "Revenue CAGR (3 yrs)", desc: "Compound annual revenue growth over the last 3 fiscal years" },
  { key: "revenueGrowth5Y", label: "Revenue CAGR (5 yrs)", desc: "Compound annual revenue growth over the last 5 fiscal years" },
  { key: "revenueGrowthTTMYoy", label: "Revenue growth (TTM YoY)", desc: "Trailing-12-month revenue vs the prior 12 months" },
  { key: "revenueGrowthQuarterlyYoy", label: "Revenue growth (latest qtr YoY)", desc: "Most recent quarter vs the same quarter a year ago" },
  { key: "epsGrowth3Y", label: "EPS CAGR (3 yrs)", desc: "Compound annual EPS growth over 3 fiscal years" },
  { key: "epsGrowth5Y", label: "EPS CAGR (5 yrs)", desc: "Compound annual EPS growth over 5 fiscal years" },
  { key: "epsGrowthTTMYoy", label: "EPS growth (TTM YoY)", desc: "Trailing-12-month EPS vs the prior 12 months" },
  { key: "epsGrowthQuarterlyYoy", label: "EPS growth (latest qtr YoY)", desc: "Most recent quarter EPS vs a year ago" },
  { key: "netMarginGrowth5Y", label: "Net margin growth (5 yrs)", desc: "Annual growth of net profit margin over 5 years" },
];
const MARKET_CAPS = [[0, "Any"], [2e9, "$2B+ (mid cap)"], [10e9, "$10B+ (large cap)"], [50e9, "$50B+"], [200e9, "$200B+ (mega cap)"]];
const SORTS = [
  ["pe", "P/E (TTM), low → high"], ["ps", "P/S (TTM), low → high"], ["peg", "PEG, low → high"],
  ["growth", "Selected growth metric, high → low"], ["marketCap", "Market cap, high → low"],
];

const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : undefined);
function pickMetrics(m) {
  // Keep only what the table needs so the localStorage cache stays small.
  const out = {
    marketCap: num(m.marketCapitalization) !== undefined ? m.marketCapitalization * 1e6 : undefined,
    pe: num(m.peTTM) ?? num(m.peBasicExclExtraTTM) ?? num(m.peExclExtraTTM),
    ps: num(m.psTTM),
    pb: num(m.pbQuarterly) ?? num(m.pb) ?? num(m.pbAnnual),
    peg: num(m.pegTTM) ?? num(m.peg),
    evEbitda: num(m.currentEv_ebitdaTTM) ?? num(m["currentEv/ebitdaTTM"]),
    netMargin: num(m.netProfitMarginTTM),
    opMargin: num(m.operatingMarginTTM),
    roe: num(m.roeTTM),
    epsTtm: num(m.epsTTM) ?? num(m.epsBasicExclExtraItemsTTM),
    divYield: num(m.dividendYieldIndicatedAnnual) ?? num(m.currentDividendYieldTTM),
    change52w: num(m["52WeekPriceReturnDaily"]),
    revenuePerShareTTM: num(m.revenuePerShareTTM),
  };
  for (const g of GROWTH_METRICS) out[g.key] = num(m[g.key]);
  return out;
}
async function getMetrics(symbol, force = false) {
  if (!force) { const c = cacheGet("m:" + symbol, CACHE_TTL); if (c) return c; }
  try {
    const r = await api("/stock/metric", { symbol, metric: "all" });
    const v = r && r.metric && Object.keys(r.metric).length ? pickMetrics(r.metric) : { empty: true };
    cacheSet("m:" + symbol, v);
    return v;
  } catch (e) {
    if (/API key/.test(e.message)) throw e;
    const v = { error: e.message }; cacheSet("m:" + symbol, v); return v;
  }
}

const DEFAULT_FILTERS = { minMarketCap: 10e9, sector: "", sortBy: "pe", growthMetric: "revenueGrowth3Y", minGrowth: "", maxPE: "", maxPS: "", limit: 50 };
let filters = Object.assign({}, DEFAULT_FILTERS, safeJson(localStorage.getItem(LS.filters)) || {});
function safeJson(s) { try { return s ? JSON.parse(s) : null; } catch { return null; } }
let loading = { running: false, done: 0, total: 0, cancel: false };
let topError = "";

function universe() {
  if (localStorage.getItem(LS.useCustom) === "1") {
    const text = localStorage.getItem(LS.custom) || "";
    const syms = text.split(/[\s,;]+/).map((s) => s.trim().toUpperCase()).filter(Boolean);
    return [...new Set(syms)].map((s) => UNIVERSE.find((u) => u.symbol === s) || { symbol: s, name: s, sector: "", industry: "" });
  }
  return UNIVERSE;
}

async function loadUniverse(force = false) {
  if (!apiKey) { topError = "Enter a Finnhub API key first (free at finnhub.io/register)."; render(); return; }
  if (loading.running) { loading.cancel = true; return; }
  topError = "";
  const list = universe();
  loading = { running: true, done: 0, total: list.length, cancel: false };
  render();
  let n = 0;
  for (const u of list) {
    if (loading.cancel) break;
    if (!force && cacheGet("m:" + u.symbol, CACHE_TTL)) { loading.done++; continue; }
    try { await getMetrics(u.symbol, force); }
    catch (e) { topError = e.message; break; }
    loading.done++;
    if (++n % 3 === 0) renderTable();   // refresh table as rows arrive, without re-rendering inputs
    renderStatus();
  }
  loading.running = false; loading.cancel = false;
  render();
}

// ============================================================================
// Screening
// ============================================================================
function screen() {
  const rows = []; let pending = 0, loaded = 0;
  for (const u of universe()) {
    const m = cacheGet("m:" + u.symbol, CACHE_TTL);
    if (!m) { pending++; continue; }
    loaded++;
    if (m.empty || m.error) continue;
    if ((m.marketCap ?? 0) < filters.minMarketCap) continue;
    if (filters.sector && u.sector !== filters.sector) continue;
    if (m.pe === undefined || m.pe <= 0) continue;                       // losses: no meaningful P/E
    if (filters.maxPE !== "" && m.pe > +filters.maxPE) continue;
    if (filters.maxPS !== "" && (m.ps === undefined || m.ps > +filters.maxPS)) continue;
    if (filters.minGrowth !== "") { const g = m[filters.growthMetric]; if (g === undefined || g < +filters.minGrowth) continue; }
    if (filters.sortBy === "ps" && !(m.ps > 0)) continue;
    if (filters.sortBy === "peg" && !(m.peg > 0)) continue;
    rows.push({ ...u, m });
  }
  const key = (r) => ({
    pe: r.m.pe ?? Infinity, ps: r.m.ps ?? Infinity, peg: r.m.peg ?? Infinity,
    marketCap: -(r.m.marketCap ?? 0), growth: -(r.m[filters.growthMetric] ?? -Infinity),
  })[filters.sortBy];
  rows.sort((a, b) => key(a) - key(b));
  return { rows: rows.slice(0, +filters.limit), pending, loaded, total: universe().length };
}

const fmtMoney = (n) => { if (n === undefined) return "–"; const a = Math.abs(n); const [d, s] = a >= 1e12 ? [1e12, "T"] : a >= 1e9 ? [1e9, "B"] : a >= 1e6 ? [1e6, "M"] : [1e3, "K"]; return (n < 0 ? "-" : "") + "$" + (a / d).toFixed(a / d >= 100 ? 0 : 1) + s; };
const fmtR = (n, d = 1) => (n === undefined ? "–" : n.toFixed(d));
const fmtPct = (n, d = 1) => (n === undefined ? "–" : (n > 0 ? "+" : "") + n.toFixed(d) + "%");   // n already in percent
const cls = (n) => (n === undefined ? "dim" : n >= 0 ? "up" : "down");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (ts) => (ts ? new Date(typeof ts === "number" ? ts * 1000 : ts).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "–");
const ago = (ts) => { const h = Math.floor((Date.now() - ts * 1000) / 36e5); return h < 1 ? "just now" : h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago"; };

function renderStatus() {
  const el = document.getElementById("status"); if (!el) return;
  const s = screen();
  const pct = s.total ? Math.round(((loading.running ? loading.done : s.loaded) / s.total) * 100) : 0;
  const stale = Object.values(cache).some((e) => Date.now() - e.t > CACHE_TTL);
  el.innerHTML = (topError ? `<div class="err">${esc(topError)}</div>` : "") +
    `<div class="status">
      <span>${s.rows.length} shown</span>
      ${loading.running ? `<span><span class="bar"><span style="width:${pct}%"></span></span> Fetching ${loading.done}/${loading.total} <span class="dim">(~${Math.ceil((loading.total - loading.done) * MIN_GAP_MS / 60000)} min left at 55 req/min)</span></span>`
        : s.loaded < s.total ? `<span class="muted">${s.loaded}/${s.total} companies loaded — click <b>Load / update data</b> to fetch the rest${s.pending ? ` (${s.pending} pending)` : ""}</span>`
        : `<span>All ${s.total} companies loaded${stale ? " (some data older than 24h)" : ""}</span>`}

}

// Company detail: profile, financial history (SEC filings), news, competitors
// ============================================================================
const NEWS_TAGS = [
  ["earnings", /\b(earnings|eps|quarter(ly)? results|q[1-4]\b|beats?|misses?|reported)/i],
  ["revenue", /\b(revenue|sales|bookings|top[- ]line)\b/i],
  ["guidance", /\b(guidance|outlook|forecast|raises?|lowers?|cuts? (its )?(outlook|forecast))\b/i],
  ["profit", /\b(profit|margin|net income|bottom[- ]line|loss(es)?)\b/i],
  ["growth", /\b(growth|expan(d|sion)|demand|ramp)\b/i],
  ["M&A", /\b(acqui(re|sition)|merger|buyout|takeover|deal|divest)/i],
  ["analyst", /\b(upgrade|downgrade|price target|rating|analyst|overweight|underweight)\b/i],
  ["costs", /\b(layoffs?|job cuts|restructur|cost[- ]cut|tariff|inflation|supply chain)\b/i],
  ["legal/regulatory", /\b(lawsuit|antitrust|regulator|fda|probe|investigation|fine|settlement|recall)\b/i],
  ["product", /\b(launch(es)?|unveils?|new product|contract|partnership|wins?)\b/i],
  ["capital", /\b(dividend|buyback|repurchase|debt|offering|split)\b/i],
];
const tagsFor = (t) => NEWS_TAGS.filter(([, re]) => re.test(t)).map(([n]) => n);

// XBRL concepts (us-gaap) that carry the lines we chart. Finnhub reports them as e.g. "us-gaap_Revenues".
const CONCEPTS = {
  revenue: ["Revenues", "RevenueFromContractWithCustomerExcludingAssessedTax", "SalesRevenueNet", "RevenuesNetOfInterestExpense", "TotalRevenuesAndOtherIncome", "RevenueFromContractWithCustomerIncludingAssessedTax"],
  operatingIncome: ["OperatingIncomeLoss"],
  netIncome: ["NetIncomeLoss", "ProfitLoss", "NetIncomeLossAvailableToCommonStockholdersBasic"],
  eps: ["EarningsPerShareDiluted", "EarningsPerShareBasicAndDiluted", "EarningsPerShareBasic"],
};
function pickLine(items, names) {
  for (const n of names) {
    const it = (items || []).find((i) => typeof i.concept === "string" && i.concept.replace(/^.*[:_]/, "") === n && typeof i.value === "number");
    if (it) return it.value;
  }
  return undefined;
}
function parseFilings(data) {
  const rows = (data || []).map((f) => ({
    form: f.form, year: f.year, quarter: f.quarter, endDate: (f.endDate || "").slice(0, 10), startDate: (f.startDate || "").slice(0, 10),
    revenue: pickLine(f.report?.ic, CONCEPTS.revenue), operatingIncome: pickLine(f.report?.ic, CONCEPTS.operatingIncome),
    netIncome: pickLine(f.report?.ic, CONCEPTS.netIncome), eps: pickLine(f.report?.ic, CONCEPTS.eps),
  })).filter((r) => r.endDate);
  const dedupe = (list) => { const m = new Map(); for (const r of list) if (!m.has(r.endDate)) m.set(r.endDate, r); return [...m.values()].sort((a, b) => a.endDate.localeCompare(b.endDate)); };
  return { annual: dedupe(rows.filter((r) => r.form === "10-K")), quarterly: dedupe(rows.filter((r) => r.form === "10-Q")) };
}
const yoy = (list, i, f, lag) => { const a = list[i]?.[f], b = list[i - lag]?.[f]; return a === undefined || b === undefined || b <= 0 ? undefined : (a / b - 1) * 100; };
const cagr = (list, f, yrs) => { const a = list[list.length - 1]?.[f], b = list[list.length - 1 - yrs]?.[f]; return a === undefined || b === undefined || b <= 0 || a <= 0 ? undefined : (Math.pow(a / b, 1 / yrs) - 1) * 100; };

async function getDetail(symbol) {
  const c = cacheGet("d:" + symbol, DETAIL_TTL); if (c) return c;
  const to = new Date(), from = new Date(Date.now() - 45 * 864e5);
  const iso = (d) => d.toISOString().slice(0, 10);
  const safe = (p) => p.catch((e) => { console.warn(e); return null; });
  const [profile, quote, news, filings, peers] = await Promise.all([
    safe(api("/stock/profile2", { symbol })), safe(api("/quote", { symbol })),
    safe(api("/company-news", { symbol, from: iso(from), to: iso(to) })),
    safe(api("/stock/financials-reported", { symbol })),
    safe(api("/stock/peers", { symbol })),
  ]);
  const metrics = await getMetrics(symbol);
  const peerSyms = (Array.isArray(peers) ? peers : []).filter((p) => p && p !== symbol && !/[.^=]/.test(p)).slice(0, 5);
  const competitors = [];
  for (const p of peerSyms) {
    const m = await getMetrics(p);
    const u = UNIVERSE.find((x) => x.symbol === p);
    competitors.push({ symbol: p, name: u?.name, m });
  }
  const d = {
    profile: profile || {}, quote: quote || {}, metrics,
    news: (Array.isArray(news) ? news : []).filter((n) => n.headline && n.url).map((n) => ({ id: n.id, headline: n.headline, source: n.source, url: n.url, t: n.datetime, summary: n.summary, tags: tagsFor(n.headline + " " + (n.summary || "")) }))
      .sort((a, b) => (b.tags.length > 0) - (a.tags.length > 0) || b.t - a.t).slice(0, 25),
    fin: parseFilings(filings?.data), competitors,
  };
  cacheSet("d:" + symbol, d);
  return d;
}

async function renderDetail(symbol) {
  app.innerHTML = `<a href="#">← Back to screener</a><p class="muted" style="margin-top:24px">Loading ${esc(symbol)}… (profile, news, filings and peers — about 10 requests)</p>`;
  if (!apiKey) { app.innerHTML = `<a href="#">← Back to screener</a><div class="err" style="margin-top:16px">Enter a Finnhub API key on the screener page first.</div>`; return; }
  let d;
  try { d = await getDetail(symbol); } catch (e) { app.innerHTML = `<a href="#">← Back to screener</a><div class="err" style="margin-top:16px">${esc(e.message)}</div>`; return; }
  if (location.hash.slice(1).toUpperCase() !== symbol) return;   // user navigated away while loading
  const u = UNIVERSE.find((x) => x.symbol === symbol) || {};
  const m = d.metrics || {}, p = d.profile, q = d.quote;
  const stat = (l, v, c = "", title = "") => `<div class="stat" title="${esc(title)}"><div class="l">${esc(l)}</div><div class="v ${c}">${v}</div></div>`;
  const dayChg = num(q.dp);
  const { annual, quarterly } = d.fin;
  const finTable = (list, lag, caveat) => list.length === 0 ? `<p class="dim">No filings data.</p>` : `<div class="tablewrap"><table><thead><tr><th>Period end</th><th>Form</th><th class="num">Revenue</th><th class="num">YoY</th><th class="num">Op. income</th><th class="num">Net income</th><th class="num">YoY</th><th class="num">Diluted EPS</th><th class="num">YoY</th></tr></thead><tbody>${
      list.map((r, i) => [r, i]).reverse().slice(0, 10).map(([r, i]) => `<tr><td>${esc(r.endDate)}</td><td class="dim">${esc(r.form)}</td>
        <td class="num">${fmtMoney(r.revenue)}</td><td class="num ${cls(yoy(list, i, "revenue", lag))}">${fmtPct(yoy(list, i, "revenue", lag))}</td>
        <td class="num">${fmtMoney(r.operatingIncome)}</td><td class="num">${fmtMoney(r.netIncome)}</td><td class="num ${cls(yoy(list, i, "netIncome", lag))}">${fmtPct(yoy(list, i, "netIncome", lag))}</td>
        <td class="num">${r.eps === undefined ? "–" : r.eps.toFixed(2)}</td><td class="num ${cls(yoy(list, i, "eps", lag))}">${fmtPct(yoy(list, i, "eps", lag))}</td></tr>`).join("")
    }</tbody></table></div>${caveat ? `<div class="help">${caveat}</div>` : ""}`;
  const compRow = (c, self) => `<tr class="${self ? "self" : ""}"><td>${self ? `<b>${esc(c.symbol)}</b>` : `<a href="#${esc(c.symbol)}"><b>${esc(c.symbol)}</b></a>`}<div class="small">${esc(c.name || "")}</div></td>
      <td class="num">${fmtMoney(c.m?.marketCap)}</td><td class="num">${fmtR(c.m?.pe)}</td><td class="num">${fmtR(c.m?.ps, 2)}</td><td class="num">${fmtR(c.m?.peg, 2)}</td><td class="num">${fmtR(c.m?.pb, 2)}</td>
      <td class="num ${cls(c.m?.netMargin)}">${fmtPct(c.m?.netMargin)}</td><td class="num ${cls(c.m?.revenueGrowth3Y)}">${fmtPct(c.m?.revenueGrowth3Y)}</td><td class="num ${cls(c.m?.revenueGrowthTTMYoy)}">${fmtPct(c.m?.revenueGrowthTTMYoy)}</td></tr>`;

  app.innerHTML = `
    <a href="#">← Back to screener</a>
    <div class="row" style="justify-content:space-between;align-items:flex-start;margin-top:12px">
      <div>
        <h1>${esc(p.name || u.name || symbol)} <span class="dim">(${esc(symbol)})</span></h1>
        <div class="sub">${esc(p.finnhubIndustry || u.industry || "")}${u.sector ? " · " + esc(u.sector) : ""}${p.weburl ? ` · <a href="${esc(p.weburl)}" target="_blank" rel="noreferrer">${esc(p.weburl.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : ""}${p.exchange ? ` · <span class="pill">${esc(p.exchange)}</span>` : ""}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:600">${num(q.c) !== undefined ? "$" + q.c.toFixed(2) : "–"}</div>
        <div class="${cls(dayChg)}" style="font-size:13px">${fmtPct(dayChg, 2)} today · <span class="${cls(m.change52w)}">${fmtPct(m.change52w, 0)} 52w</span></div>
      </div>
    </div>
    ${m.error ? `<div class="err" style="margin-top:12px">Metrics unavailable: ${esc(m.error)}</div>` : ""}
    <div class="stats" style="margin-top:16px">
      ${stat("Market cap", fmtMoney(m.marketCap))}${stat("P/E (TTM)", fmtR(m.pe))}${stat("P/S (TTM)", fmtR(m.ps, 2))}${stat("PEG", fmtR(m.peg, 2))}${stat("P/B", fmtR(m.pb, 2))}${stat("EV / EBITDA", fmtR(m.evEbitda))}
      ${stat("Net margin", fmtPct(m.netMargin), cls(m.netMargin))}${stat("Operating margin", fmtPct(m.opMargin), cls(m.opMargin))}${stat("ROE", fmtPct(m.roe), cls(m.roe))}${stat("EPS (TTM)", m.epsTtm === undefined ? "–" : "$" + m.epsTtm.toFixed(2))}${stat("Dividend yield", fmtPct(m.divYield))}${stat("Revenue / share", m.revenuePerShareTTM === undefined ? "–" : "$" + m.revenuePerShareTTM.toFixed(2))}
    </div>
    <div class="cols" style="margin-top:28px">
      <div>
        <section style="margin-bottom:28px"><h2>Growth</h2><div class="stats">
          ${GROWTH_METRICS.map((g) => stat(g.label, fmtPct(m[g.key]), cls(m[g.key]), g.desc)).join("")}
          ${stat("Revenue CAGR 3y (from 10-Ks)", fmtPct(cagr(annual, "revenue", 3)), cls(cagr(annual, "revenue", 3)), "Computed here from SEC annual filings")}
          ${stat("Net income CAGR 3y (from 10-Ks)", fmtPct(cagr(annual, "netIncome", 3)), cls(cagr(annual, "netIncome", 3)), "Computed here from SEC annual filings; needs positive profit at both ends")}
        </div></section>
        <section style="margin-bottom:28px"><h2>Annual results (10-K)</h2>${finTable(annual, 1, "")}</section>
        <section style="margin-bottom:28px"><h2>Quarterly results (10-Q)</h2>${finTable(quarterly, 4, "YoY compares to the filing four quarters earlier. Some companies report year-to-date figures in 10-Qs, in which case Q2/Q3 numbers are cumulative. Q4 is not filed separately (it is in the 10-K).")}</section>
        <section><h2>Top competitors</h2>
          <div class="tablewrap"><table><thead><tr><th>Company</th><th class="num">Mkt cap</th><th class="num">P/E</th><th class="num">P/S</th><th class="num">PEG</th><th class="num">P/B</th><th class="num">Net margin</th><th class="num">Rev CAGR 3y</th><th class="num">Rev TTM YoY</th></tr></thead>
          <tbody>${compRow({ symbol, name: p.name || u.name, m }, true)}${d.competitors.map((c) => compRow(c, false)).join("")}${d.competitors.length === 0 ? `<tr><td colspan="9" class="dim" style="text-align:center;padding:20px">No peers returned.</td></tr>` : ""}</tbody></table></div>
          <div class="help">Peers are Finnhub's peer group for this company (same industry / sub-industry classification).</div>
        </section>
      </div>
      <aside>
        <h2>Latest news <span class="dim" style="font-weight:400;font-size:12px">(last 45 days)</span></h2>
        <div class="help" style="margin-bottom:10px">Articles mentioning earnings, revenue, guidance, margins, M&amp;A or other profit drivers are tagged and listed first.</div>
        <ul class="news">${d.news.map((n) => `<li><a href="${esc(n.url)}" target="_blank" rel="noreferrer">${esc(n.headline)}</a><div class="small" style="max-width:none">${esc(n.source)} · ${ago(n.t)}</div>${n.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</li>`).join("") || `<li class="dim">No recent news.</li>`}</ul>
        ${p.name ? `<details style="margin-top:20px"><summary>About</summary><div class="help" style="margin-top:8px">${esc(p.name)} · ${p.country ? esc(p.country) + " · " : ""}${p.ipo ? "IPO " + esc(p.ipo) + " · " : ""}${p.marketCapitalization ? "mkt cap " + fmtMoney(p.marketCapitalization * 1e6) : ""}</div></details>` : ""}
      </aside>
    </div>`;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
